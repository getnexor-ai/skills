name: CI

# Runs on every PR and every branch push. This is the same gate the publish
# workflow runs, so a red PR can never become a green publish.

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    name: Validate skills + tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: prepublish-check
        run: npm run check

      - name: Show what would be published
        run: npm pack --dry-run
