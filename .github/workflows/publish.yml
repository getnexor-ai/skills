name: Publish to npm

# Deployment == merge to main. Every push to main publishes a new version.
#
# Versioning: if package.json's version is already on the registry, the workflow
# bumps the patch and commits it back to main with "[skip ci]" so the follow-up
# push does not re-trigger this workflow. To ship a minor or major instead, bump
# package.json yourself in the PR — the workflow sees an unpublished version and
# publishes it verbatim.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step but do not publish"
        type: boolean
        default: false

# Never let two publishes race: the second would compute its version from a
# registry state the first has already moved.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump commit + tag
      id-token: write # npm provenance attestation

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needed so the version-bump commit can be pushed back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Publishing as: $(npm whoami)"

      - name: Lint + tests
        run: |
          npm run lint
          npm test

      - name: prepublish-check
        run: npm run check

      - name: Resolve version to publish
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          echo "Package: $NAME  local version: $CURRENT"

          # `npm view` exits non-zero when the package (or version) does not exist.
          if npm view "$NAME@$CURRENT" version >/dev/null 2>&1; then
            echo "$CURRENT is already on the registry — bumping patch."
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            NEW=$(npm version patch --no-git-tag-version)
            NEW=${NEW#v}
            # Keep the marketplace manifest in lockstep; the check warns if they drift.
            node -e "
              const fs=require('fs');const p='.claude-plugin/marketplace.json';
              const m=JSON.parse(fs.readFileSync(p,'utf8'));
              m.metadata=m.metadata||{}; m.metadata.version=process.argv[1];
              fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');
            " "$NEW"
            git add package.json .claude-plugin/marketplace.json
            git commit -m "chore(release): v$NEW [skip ci]"
            git tag "v$NEW"
            echo "version=$NEW"    >> "$GITHUB_OUTPUT"
            echo "bumped=true"     >> "$GITHUB_OUTPUT"
          else
            echo "$CURRENT is not published yet — publishing as-is."
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "v$CURRENT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "bumped=false"     >> "$GITHUB_OUTPUT"
          fi

      - name: Re-run check against the resolved version
        run: npm run check

      # npm refuses to generate provenance from a private repository (the
      # attestation would point at a source nobody can verify), so only pass
      # --provenance once this repo is public. It turns itself on automatically.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" = "false" ]; then
            echo "Public repo → publishing with provenance."
            npm publish --access public --provenance
          else
            echo "Private repo → publishing without provenance (npm requires a public source repo)."
            npm publish --access public
          fi

      - name: Dry run (no publish)
        if: ${{ inputs.dry_run }}
        run: npm pack --dry-run

      - name: Push version bump and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Summary
        run: |
          {
            echo "### Published \`@nexor/skills@${{ steps.version.outputs.version }}\`"
            echo ""
            echo "- patch auto-bumped: \`${{ steps.version.outputs.bumped }}\`"
            echo "- install: \`npx skills add getnexor-ai/skills --all\`"
          } >> "$GITHUB_STEP_SUMMARY"
